[settings]
idiomatic_version_file_enable_tools = ["node", "npm", "pnpm", "yarn"]
auto_install = false
not_found_system_fallback = false

# Never delete replaced tool versions on our behalf: the deferred prune fires
# inside unrelated mise commands, and agents (and humans) read that as "mise
# removed my packages". Reclaim disk explicitly with `mise prune --dry-run`.
[settings.upgrade]
auto_prune = false

[tool_alias]
pnpm = "npm:pnpm"

[tools]
node = ["22", "24"]
pnpm = "latest"
yarn = "1"

"aqua:anthropics/claude-code" = { version = "latest", minimum_release_age = "0s" }
"aqua:colbymchenry/codegraph" = "latest"
"aqua:earendil-works/pi" = { version = "latest", minimum_release_age = "0s" }
"github:Fission-AI/OpenSpec" = { version = "latest", bin = "openspec" }
"aqua:openai/codex" = { version = "latest", minimum_release_age = "0s" }
"aqua:anomalyco/opencode" = { version = "latest", minimum_release_age = "0s" }
"npm:@playwright/cli" = "latest"
"npm:tripo-cli" = "latest"
bun = "latest"

[wrappers]
opencode2 = "opencode"
